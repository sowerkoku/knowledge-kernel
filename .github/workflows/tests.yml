name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

      - name: Verify CLI wrappers load (no execution)
        # The wrappers read from the operator's production dataset by default
        # (os.environ.setdefault). We only verify they import cleanly — running
        # them would require a dataset, which pytest already covers.
        run: |
          python -c "from cmdb.api import cmdb_validate; print('cmdb.api OK')"
          python -c "import importlib.util, pathlib; spec = importlib.util.spec_from_file_location('w', 'integrations/hermes/tools/cmdb_validate.py'); mod = importlib.util.module_from_spec(spec); print('wrapper import OK')"
